# Test profile configuration (no real credentials or production secrets stored here)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus-placement-system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:test-only-jwt-secret-key-must-be-at-least-32-chars}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
